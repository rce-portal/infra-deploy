name: Deploy Portal Institucional

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gh-deploy
          aws-region: us-east-1

      - name: Run deploy
        run: ./deploy/deploy.sh

      - name: Persist deploy log
        run: |
          TS=$(date -u +%Y-%m-%dT%H-%M)
          cp /tmp/deploy.log "deploy/logs/deploy-${TS}.log"
          git config user.email "ci@rce.edu.ar"
          git config user.name  "rce-ci"
          git add deploy/logs/
          git commit -m "ci: deploy log ${TS}" || true
          git push || true
